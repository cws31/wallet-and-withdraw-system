spring.application.name=veloop-rewards-backend
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}


logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

security.rate-limit.enabled=true

security.rate-limit.login-requests=5
security.rate-limit.login-window-seconds=60

security.rate-limit.withdrawal-requests=5
security.rate-limit.withdrawal-window-seconds=60

security.rate-limit.wallet-mutation-requests=20
security.rate-limit.wallet-mutation-window-seconds=60

security.rate-limit.withdrawal-mutation-requests=20
security.rate-limit.withdrawal-mutation-window-seconds=60

security.rate-limit.max-entries=10000



spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}


fraud.rule.rapid-withdrawal-window-minutes=${FRAUD_RAPID_WITHDRAWAL_WINDOW_MINUTES:5}
fraud.rule.rapid-withdrawal-baseline=${FRAUD_RAPID_WITHDRAWAL_BASELINE:1}
fraud.rule.rapid-withdrawal-max-expected=${FRAUD_RAPID_WITHDRAWAL_MAX_EXPECTED:5}
fraud.rule.rapid-withdrawal-max-score=${FRAUD_RAPID_WITHDRAWAL_MAX_SCORE:40}


fraud.rule.repeated-withdrawal-window-hours=${FRAUD_REPEATED_WITHDRAWAL_WINDOW_HOURS:24}
fraud.rule.repeated-withdrawal-baseline=${FRAUD_REPEATED_WITHDRAWAL_BASELINE:2}
fraud.rule.repeated-withdrawal-max-expected=${FRAUD_REPEATED_WITHDRAWAL_MAX_EXPECTED:8}
fraud.rule.repeated-withdrawal-max-score=${FRAUD_REPEATED_WITHDRAWAL_MAX_SCORE:40}


fraud.rule.failed-requests-window-minutes=${FRAUD_FAILED_REQUESTS_WINDOW_MINUTES:10}
fraud.rule.failed-requests-baseline=${FRAUD_FAILED_REQUESTS_BASELINE:2}
fraud.rule.failed-requests-max-expected=${FRAUD_FAILED_REQUESTS_MAX_EXPECTED:8}
fraud.rule.failed-requests-max-score=${FRAUD_FAILED_REQUESTS_MAX_SCORE:35}


fraud.rule.unusual-wallet-window-minutes=${FRAUD_UNUSUAL_WALLET_WINDOW_MINUTES:15}
fraud.rule.unusual-wallet-baseline=${FRAUD_UNUSUAL_WALLET_BASELINE:4}
fraud.rule.unusual-wallet-max-expected=${FRAUD_UNUSUAL_WALLET_MAX_EXPECTED:16}
fraud.rule.unusual-wallet-max-score=${FRAUD_UNUSUAL_WALLET_MAX_SCORE:35}


fraud.rule.suspicious-payout-window-minutes=${FRAUD_SUSPICIOUS_PAYOUT_WINDOW_MINUTES:30}
fraud.rule.suspicious-payout-baseline=${FRAUD_SUSPICIOUS_PAYOUT_BASELINE:1}
fraud.rule.suspicious-payout-max-expected=${FRAUD_SUSPICIOUS_PAYOUT_MAX_EXPECTED:7}
fraud.rule.suspicious-payout-max-score=${FRAUD_SUSPICIOUS_PAYOUT_MAX_SCORE:45}


fraud.rule.suspicious-account-activity-window-minutes=${FRAUD_SUSPICIOUS_ACCOUNT_ACTIVITY_WINDOW_MINUTES:10}
fraud.rule.suspicious-account-activity-baseline=${FRAUD_SUSPICIOUS_ACCOUNT_ACTIVITY_BASELINE:2}
fraud.rule.suspicious-account-activity-max-expected=${FRAUD_SUSPICIOUS_ACCOUNT_ACTIVITY_MAX_EXPECTED:8}
fraud.rule.suspicious-account-activity-max-score=${FRAUD_SUSPICIOUS_ACCOUNT_ACTIVITY_MAX_SCORE:40}


fraud.rule.multiple-suspicious-payout-pattern-window-minutes=${FRAUD_MULTIPLE_SUSPICIOUS_PAYOUT_PATTERN_WINDOW_MINUTES:30}
fraud.rule.multiple-suspicious-payout-pattern-baseline=${FRAUD_MULTIPLE_SUSPICIOUS_PAYOUT_PATTERN_BASELINE:1}
fraud.rule.multiple-suspicious-payout-pattern-max-expected=${FRAUD_MULTIPLE_SUSPICIOUS_PAYOUT_PATTERN_MAX_EXPECTED:4}
fraud.rule.multiple-suspicious-payout-pattern-max-score=${FRAUD_MULTIPLE_SUSPICIOUS_PAYOUT_PATTERN_MAX_SCORE:40}


management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.structured.format.console=logstash
logging.structured.json.context.include=true

veloop.demo-data.enabled=${DEMO_DATA_ENABLED:false}