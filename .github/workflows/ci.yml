name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Java 21, MySQL, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: veloop_test
          MYSQL_USER: veloop_ci
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: backend

    env:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://127.0.0.1:3306/veloop_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: veloop_ci
      DB_PASSWORD: ci_password
      JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi0wMTIzNDU2Nzg5LTAxMjM0NTY3ODktMDEyMzQ1Njc4OQ==
      JWT_EXPIRATION: 900000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_TIMEOUT: 2000ms
      DEMO_DATA_ENABLED: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Maven wrapper
        run: ./mvnw --version

      - name: Run backend verification and tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend-checks:
    name: Frontend lint and production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend for production
        run: npm run build
